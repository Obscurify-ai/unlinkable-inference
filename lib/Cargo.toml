[package]
name = "chaumian-sessions"
description = "Chaumian sessions: anonymous prepaid API sessions paid with blind-signed e-cash. Client (wallet, blinding, sessions, recovery from one secret) and, with the `server` feature, the server endpoints"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["privacy", "blind-signatures", "ecash", "llm", "anonymity"]

[features]
default = ["net"]
# HTTPS transport. Off for WASM builds that bring their own fetch.
net = ["dep:reqwest"]
# The server side: session endpoints and voucher checks (axum), over your storage.
server = ["dep:async-trait", "dep:axum", "dep:http", "dep:tokio", "dep:tower", "dep:tracing"]

[[example]]
name = "gen_pass_key"
required-features = ["server"]

[dependencies]
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
anyhow.workspace = true
argon2.workspace = true
base64.workspace = true
blind-rsa-signatures.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }

# In a browser: fetch with credentials "omit" (no cookie ever goes with a
# request), the clock from Date.now(), randomness from crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "RequestCredentials", "Response", "Window", "WorkerGlobalScope"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
