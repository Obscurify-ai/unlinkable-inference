<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1300" width="1160" height="1300">
<defs><marker id="a52606d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="a0e7c86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7c86"/></marker><marker id="ab44d12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b44d12"/></marker><marker id="a6b46c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b46c1"/></marker><marker id="a2f855a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f855a"/></marker></defs>
<rect width="1160" height="1300" fill="#f7f8fa"/>
<text x="580.0" y="46" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="700" fill="#1f2933" text-anchor="middle">How Chaumian sessions work</text>
<text x="580.0" y="76" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="400" fill="#52606d" text-anchor="middle">The server is paid for every chat, but cannot tell which account a chat came from, or which chats go together.</text>
<rect x="30" y="100" width="460" height="950" rx="16" fill="#e6f6f7"/>
<rect x="670" y="100" width="460" height="950" rx="16" fill="#eceff3"/>
<text x="260.0" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#0e7c86" text-anchor="middle">Your device (browser, phone, agent)</text>
<text x="900.0" y="130" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#3e4c59" text-anchor="middle">The server</text>
<rect x="40" y="160" width="440" height="52" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="260.0" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="600" fill="#1f2933" text-anchor="middle">Account number  4417 2093 8865 0112</text>
<line x1="260.0" y1="212" x2="260.0" y2="252" stroke="#0e7c86" stroke-width="2" marker-end="url(#a0e7c86)"/>
<text x="270.0" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#0e7c86" text-anchor="start">Argon2id: a deliberately slow hash</text>
<rect x="40" y="256" width="200" height="58" rx="10" fill="#0e7c86" stroke="#0e7c86" stroke-width="1.5"/>
<text x="140.0" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Seed</text>
<text x="140.0" y="299" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">never leaves the device</text>
<rect x="280" y="256" width="200" height="58" rx="10" fill="#fff" stroke="#0e7c86" stroke-width="1.5"/>
<text x="380.0" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Login key</text>
<text x="380.0" y="299" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">sent to sign in</text>
<rect x="680" y="256" width="440" height="58" rx="10" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="900.0" y="280" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Account: stores only a keyed hash of the login key</text>
<text x="900.0" y="299" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Never sees the number or the seed</text>
<line x1="480" y1="285" x2="680" y2="285" stroke="#52606d" stroke-width="2" marker-end="url(#a52606d)"/>
<text x="580.0" y="277" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#52606d" text-anchor="middle">sign in</text>
<circle cx="580.0" cy="360" r="15" fill="#1f2933"/>
<text x="580.0" y="365" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="580.0" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Top up the wallet</text>
<rect x="40" y="432" width="440" height="58" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="260.0" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Makes blank vouchers from the seed</text>
<text x="260.0" y="475" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">and blinds them (scrambles them)</text>
<line x1="480" y1="447" x2="680" y2="447" stroke="#b44d12" stroke-width="2" marker-end="url(#ab44d12)"/>
<text x="580.0" y="439" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#b44d12" text-anchor="middle">blinded blanks + account key</text>
<rect x="680" y="432" width="440" height="58" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="900.0" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Takes $1 from the account and signs the blanks</text>
<text x="900.0" y="475" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">without seeing them (blind signature)</text>
<line x1="680" y1="480" x2="480" y2="480" stroke="#b44d12" stroke-width="2" marker-end="url(#ab44d12)"/>
<text x="580.0" y="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#b44d12" text-anchor="middle">signatures</text>
<rect x="40" y="512" width="440" height="46" rx="10" fill="#fff7ed" stroke="#b44d12" stroke-width="1.5"/>
<text x="260.0" y="540" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="600" fill="#7b341e" text-anchor="middle">Unblinds them: a wallet of vouchers the server has never seen</text>
<circle cx="580.0" cy="600" r="15" fill="#1f2933"/>
<text x="580.0" y="605" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="580.0" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Each conversation opens a session</text>
<rect x="40" y="672" width="440" height="58" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="260.0" y="696" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Pays with vouchers and picks a session secret</text>
<text x="260.0" y="715" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">sk-chs1_…  (also from the seed)</text>
<line x1="480" y1="701" x2="680" y2="701" stroke="#6b46c1" stroke-width="2" marker-end="url(#a6b46c1)"/>
<text x="580.0" y="675" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#6b46c1" text-anchor="middle">vouchers + hash of the secret</text>
<text x="580.0" y="693" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#6b46c1" text-anchor="middle">no account, no cookie</text>
<rect x="680" y="672" width="440" height="58" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="900.0" y="696" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Vouchers valid and never spent: session open</text>
<text x="900.0" y="715" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">It cannot tell whose vouchers they are</text>
<circle cx="580.0" cy="760" r="15" fill="#1f2933"/>
<text x="580.0" y="765" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="580.0" y="798" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Chat</text>
<rect x="40" y="832" width="440" height="46" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="260.0" y="860" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Every request: Authorization: Bearer sk-chs1_…</text>
<line x1="480" y1="855" x2="680" y2="855" stroke="#6b46c1" stroke-width="2" marker-end="url(#a6b46c1)"/>
<text x="580.0" y="847" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#6b46c1" text-anchor="middle">the secret instead of an API key</text>
<rect x="680" y="832" width="440" height="46" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="900.0" y="860" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Charges each request to the session, per token</text>
<circle cx="580.0" cy="900" r="15" fill="#1f2933"/>
<text x="580.0" y="905" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="580.0" y="938" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Quiet for 5 minutes: close</text>
<rect x="40" y="972" width="440" height="58" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="260.0" y="996" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Sends blank vouchers for the change</text>
<text x="260.0" y="1015" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Gets them back signed: into the wallet</text>
<line x1="480" y1="990" x2="680" y2="990" stroke="#b44d12" stroke-width="2" marker-end="url(#ab44d12)"/>
<line x1="680" y1="1016" x2="480" y2="1016" stroke="#b44d12" stroke-width="2" marker-end="url(#ab44d12)"/>
<text x="580.0" y="1040" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500" fill="#b44d12" text-anchor="middle">change, blind-signed</text>
<rect x="680" y="972" width="440" height="58" rx="10" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="900.0" y="996" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">Signs the change blindly</text>
<text x="900.0" y="1015" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">and forgets the session once collected</text>
<rect x="30" y="1090" width="1100" height="190" rx="16" fill="#fff" stroke="#cbd2d9" stroke-width="1.5"/>
<text x="60" y="1124" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">All the server can see</text>
<rect x="60" y="1144" width="440" height="58" rx="10" fill="#fff7ed" stroke="#b44d12" stroke-width="1.5"/>
<text x="280.0" y="1168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="400" fill="#7b341e" text-anchor="middle">Account 4f1c…  took $1.00 at 10:02</text>
<text x="280.0" y="1187" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="400" fill="#7b341e" text-anchor="middle">Account 4f1c…  took $1.00 at 16:40</text>
<rect x="660" y="1144" width="440" height="58" rx="10" fill="#f3f0ff" stroke="#6b46c1" stroke-width="1.5"/>
<text x="880.0" y="1168" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="400" fill="#44337a" text-anchor="middle">Session 7a9e…  $0.50, 41 requests, closed</text>
<text x="880.0" y="1187" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="400" fill="#44337a" text-anchor="middle">Session c03b…  $0.50, 12 requests, closed</text>
<line x1="510" y1="1173" x2="650" y2="1173" stroke="#c53030" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="566" y1="1160" x2="594" y2="1186" stroke="#c53030" stroke-width="3"/><line x1="594" y1="1160" x2="566" y2="1186" stroke="#c53030" stroke-width="3"/>
<text x="580.0" y="1230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="600" fill="#c53030" text-anchor="middle">No record joins an account to a session, or one session to another.</text>
<text x="580.0" y="1256" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" font-weight="400" fill="#52606d" text-anchor="middle">Lost the device or closed Tor Browser? Type the number again: the same seed rebuilds every secret and voucher, and the money comes back.</text>
</svg>