name: proofs
on:
  push:
  pull_request:
jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y opam
          opam init -y --disable-sandboxing --bare
          opam switch create -y default 4.14.2
          opam install -y proverif.2.05
          echo "$HOME/.opam/default/bin" >> "$GITHUB_PATH"
          curl -sSL -o "$HOME/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA_JAR=$HOME/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Models, approval and every break caught
        run: |
          python3 spec/check.py --no-kani
          python3 spec/mutants.py --no-kani
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          args: -p unlinkable-inference --no-default-features
