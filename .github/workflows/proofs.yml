name: proofs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proofs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y opam libgtk2.0-dev
          opam init -y --disable-sandboxing --bare
          opam switch create -y default 4.14.2
          opam install -y proverif.2.05
          echo "$HOME/.opam/default/bin" >> "$GITHUB_PATH"
          curl -sSL -o "$HOME/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "TLA_JAR=$HOME/tla2tools.jar" >> "$GITHUB_ENV"
          cargo install --locked kani-verifier
          cargo kani setup
      # Both run to the end even when something fails, so the results below are complete.
      - name: Every proof, and the approval
        id: check
        continue-on-error: true
        run: python3 spec/check.py
      - name: Every break caught
        id: mutants
        continue-on-error: true
        run: python3 spec/mutants.py
      # The Rules page of the Obscurify admin panel reads this (spec/status.py). Written
      # outside the checkout: a new file in it would mark the results above out of date.
      - name: Results for the admin page
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          python3 spec/status.py > "$RUNNER_TEMP/site/status.json"
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Pass only if every proof and break did, and the rules are approved
        if: steps.check.outcome == 'failure' || steps.mutants.outcome == 'failure'
        run: exit 1
  publish:
    needs: proofs
    if: always() && github.ref == 'refs/heads/main' && needs.proofs.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
