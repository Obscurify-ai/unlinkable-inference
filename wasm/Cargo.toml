[package]
name = "chaumian-sessions-wasm"
description = "Chaumian sessions in a browser: the core client as a WebAssembly module"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["privacy", "blind-signatures", "ecash", "llm", "anonymity"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chaumian-sessions = { path = "../lib" }
futures.workspace = true
hex.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
