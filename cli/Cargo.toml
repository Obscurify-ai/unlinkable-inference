[package]
name = "unlinkable-inference-cli"
description = "Local proxy for unlinkable inference: OpenAI and Anthropic endpoints on localhost paid from a voucher wallet, one session per conversation"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["privacy", "blind-signatures", "ecash", "llm", "anonymity"]

[[bin]]
name = "unlinkable-inference"
path = "src/main.rs"

[dependencies]
unlinkable-inference = { workspace = true, features = ["net"] }
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
unlinkable-inference = { workspace = true, features = ["server"] }
unlinkable-inference-reference-server.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
