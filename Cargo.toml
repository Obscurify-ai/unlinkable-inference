[workspace]
resolver = "2"
members = ["lib", "cli", "reference-server", "wasm"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/Obscurify-ai/unlinkable-inference"

[workspace.dependencies]
unlinkable-inference = { version = "0.3.1", path = "lib", default-features = false }
unlinkable-inference-reference-server = { path = "reference-server" }
anyhow = "1"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
blind-rsa-signatures = "0.18"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "thin"

# RSA key generation and blind signing are slow unoptimised; tests generate keys.
[profile.dev.package."*"]
opt-level = 3
